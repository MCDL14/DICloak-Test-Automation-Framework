# Copy this file to config/remote_sync.yaml only when the default remote
# snapshot sync rules need local overrides.
#
# The real config/remote_sync.yaml is ignored by git. By default, remote sync
# now publishes local config/ and test_data/ so remote nodes run with the same
# runtime config and fixtures as this workspace. Remote connection configs,
# logs, screenshots, reports, and remote_artifacts are always excluded even if
# a local override forgets them.

include:
  - "*.md"
  - "run.py"
  - "streamlit_runner.py"
  - "requirements*.txt"
  - "pyproject.toml"
  - "core/**"
  - "locators/**"
  - "pages/**"
  - "tests/**"
  - "ui/**"
  - "config/**"
  - "test_data/**"

exclude:
  - ".git/**"
  - ".venv/**"
  - "venv/**"
  - "env/**"
  - "__pycache__/**"
  - "**/__pycache__/**"
  - "*.pyc"
  - "*.pyo"
  - ".pytest_cache/**"
  - ".mypy_cache/**"
  - ".ruff_cache/**"
  - "logs/**"
  - "reports/**"
  - "screenshots/**"
  - "remote_artifacts/**"
  - "config/remote_hosts.yaml"
  - "config/remote_sync.yaml"
  - "config/remote_connection_cache.yaml"
  - "config/account_groups.yaml"
  - "config/.ui_account_profile_*.yaml"
